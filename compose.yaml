services:
  anywheretoagent:
    build: .
    image: anywheretoagent:local
    restart: unless-stopped
    # Linux only: both listeners stay on host loopback; HTTPS proxy runs on this host.
    network_mode: host
    user: "10001:10001"
    command:
      - --data-dir
      - /data
      - --listen
      - 127.0.0.1:8080
      - --public-url
      - ${ANYWHERE_TO_AGENT_PUBLIC_URL:-${CODEX_REMOTE_PUBLIC_URL:?Set ANYWHERE_TO_AGENT_PUBLIC_URL to your HTTPS relay URL}}
      - --admin-listen
      - 127.0.0.1:9090
    volumes:
      - ./data/state:/data
    stop_grace_period: 20s
